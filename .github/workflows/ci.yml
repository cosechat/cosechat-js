name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # tests that need ../cosechat-py (two-way vectors, file compatibility) skip here
      - run: npm test
      - run: npm run types
      - run: npx -y prettier --check .
