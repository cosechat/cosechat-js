<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cosechat web</title>
    <link rel="icon" href="data:," />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      // daisyUI ships a light and a dark theme; follow whatever the OS asks for.
      ;(() => {
        const scheme = matchMedia('(prefers-color-scheme: dark)')
        const apply = () => (document.documentElement.dataset.theme = scheme.matches ? 'dark' : 'light')
        scheme.addEventListener('change', apply)
        apply()
      })()
    </script>
    <script type="importmap">
      {
        "imports": {
          "cosechat/": "./src/",
          "@noble/hashes/": "./node_modules/@noble/hashes/",
          "@noble/curves/": "./node_modules/@noble/curves/",
          "@noble/ciphers/": "./node_modules/@noble/ciphers/",
          "@noble/post-quantum/": "./node_modules/@noble/post-quantum/",
          "cborg": "./node_modules/cborg/cborg.js"
        }
      }
    </script>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow-sm gap-2 px-4">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl font-bold">cosechat</span>
        <span class="badge badge-ghost hidden sm:inline-flex">post-quantum mesh chat</span>
      </div>
      <div id="status" class="badge badge-warning">connecting…</div>
    </div>

    <main class="grid gap-4 p-4 lg:grid-cols-[24rem_1fr]">
      <section class="flex flex-col gap-4 min-w-0">
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body gap-3">
            <div class="join w-full">
              <label class="floating-label join-item w-full">
                <span>Your name (announced)</span>
                <input id="name" class="input w-full" placeholder="Your name" />
              </label>
              <button id="announce" class="btn join-item" title="announce now (it also does on join, then every 30 minutes)" disabled>Announce</button>
            </div>
            <div>
              <div class="flex items-center gap-1">
                <span class="text-xs opacity-60 flex-1">your address</span>
                <button id="copy-address" class="btn btn-xs btn-ghost">copy</button>
                <button id="regenerate" class="btn btn-xs btn-ghost" title="make a new identity">regenerate</button>
              </div>
              <div id="address" class="mono text-xs sm:text-sm whitespace-nowrap overflow-hidden text-ellipsis"></div>
            </div>
          </div>
        </div>

        <div class="join w-full">
          <input id="find" class="input join-item w-full mono" placeholder="find someone by address" />
          <button id="find-go" class="btn join-item">Find</button>
        </div>

        <ul id="peers" class="menu bg-base-100 rounded-box shadow-sm w-full"></ul>

        <details class="text-sm">
          <summary class="cursor-pointer opacity-60">log</summary>
          <pre id="log" class="mt-2 bg-base-100 rounded-box p-3 text-xs h-64 overflow-auto whitespace-pre-wrap break-all"></pre>
        </details>
      </section>

      <section class="card bg-base-100 shadow-sm min-w-0 h-[calc(100vh-7rem)] min-h-[24rem]">
        <div id="chat-header" class="flex items-center gap-2 border-b border-base-300 p-4"></div>
        <div id="messages" class="flex-1 overflow-auto p-4"></div>
        <form id="composer" class="join w-full border-t border-base-300 p-4">
          <input id="text" class="input join-item w-full" placeholder="pick a peer, then type a message" autocomplete="off" disabled />
          <button id="send" class="btn btn-primary join-item" disabled>Send</button>
        </form>
      </section>
    </main>

    <div id="toasts" class="toast toast-top toast-end z-50 pointer-events-none mt-14"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
